[workspace]
members = [
  "crates/godharness-cli",
  "crates/godharness-core",
]
resolver = "3"

[workspace.package]
version = "0.1.6"
edition = "2024"
rust-version = "1.97"
authors = ["Tomer Gal"]
description = "Agent-context and documentation-governance framework."
license = "MIT"
repository = "https://github.com/tomerwave/godharness"
keywords = ["agents", "documentation", "context", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
expect_used = "warn"
todo = "warn"
unwrap_used = "warn"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
glob = "0.3"
gray_matter = "0.3"
petgraph = "0.6"
dirs = "5"
